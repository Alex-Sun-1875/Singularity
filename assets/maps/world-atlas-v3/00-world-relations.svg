<rect x="1770" y="180" width="590" height="390" rx="14" fill="#f5f0df" stroke="#9eab93"/>
<text x="1794" y="220" font-size="27" fill="#244a40" font-weight="700" text-anchor="start" >世界范围 ≠ 一张首区图</text>
<text x="1795" y="265" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >R1 镇 / 废村 / 军营 / 湿林 / 古渠</text>
<text x="1795" y="314" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >R2 矿业聚落 / 高地 / 矿桥 / 古矿门</text>
<text x="1795" y="363" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >R3 河埠镇 / 旧堂 / 农庄 / 湿地</text>
<text x="1795" y="412" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >R4 外城 / 街区 / 军营 / 城墙 / 内堡</text>
<text x="1795" y="461" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >R1—R4 均有各自的地理规划详图；</text>
<text x="1795" y="510" font-size="23" fill="#42594c" font-weight="400" text-anchor="start" >本页仅表达世界关系，不等于可玩完成。</text>
<rect x="1770" y="595" width="590" height="450" rx="14" fill="#f5f0df" stroke="#9eab93"/>
<text x="1794" y="635" font-size="27" fill="#244a40" font-weight="700" text-anchor="start" >8 个上下层端口，不随意穿墙</text>
<text x="1795" y="675" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E01 普通插销；首次入内能原路返</text>
<text x="1795" y="722" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E02 梯首次从地表放下；E03 地下开</text>
<text x="1795" y="769" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E05 矿井地表机械先开</text>
<text x="1795" y="816" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E07 地下开出口，只到 R3 旱谷</text>
<text x="1795" y="863" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E04 只先到 U2 前厅；深闸由 03 开</text>
<text x="1795" y="910" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E06 从 R3 旧堂下去可到深闸内侧</text>
<text x="1795" y="957" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >E08 只到 R4 堡外，不到主奖宝库</text>
<rect x="1770" y="1070" width="590" height="425" rx="14" fill="#f5f0df" stroke="#9eab93"/>
<text x="1794" y="1110" font-size="27" fill="#244a40" font-weight="700" text-anchor="start" >白枝第七远征 · V4叙事锚点</text>
<text x="1795" y="1150" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >艾妲反陷阱；布兰识阵、检验旧誓。</text>
<text x="1795" y="1196" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >蕾萨追古兽；墨伦复核有限显影。</text>
<text x="1795" y="1242" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >8主场景 / 6支线 / 4核心有限协作。</text>
<text x="1795" y="1288" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >普通旅行不自动完成故事或开门。</text>
<text x="1795" y="1334" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >U1 与 U2 无直接地下边。</text>
<text x="1795" y="1380" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >没有虚构公里数、已测游玩时长。</text>
<text x="1795" y="1426" font-size="22" fill="#42594c" font-weight="400" text-anchor="start" >剧情以V4候选与02覆盖图为准。</text>
</g></svg>