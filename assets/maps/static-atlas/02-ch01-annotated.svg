="283" font-size="18" fill="#d3d9cb">G · cp_ch01_gate / 战前转角</text><text x="1484" y="337" font-size="22" font-weight="700" fill="#dbb56f">商人分工</text><text x="1484" y="372" font-size="18" fill="#d3d9cb">艾妲 J03 寻纹铜戒 · 28币</text><text x="1484" y="401" font-size="18" fill="#d3d9cb">布兰 A13 誓石战靴 · 32币</text><text x="1484" y="430" font-size="18" fill="#d3d9cb">蕾萨 A10 扣弦手套 · 40币</text><text x="1484" y="459" font-size="18" fill="#d3d9cb">均为可选购买，不是通路钥匙</text><text x="1484" y="513" font-size="22" font-weight="700" fill="#dbb56f">核心动作与奖励</text><text x="1484" y="548" font-size="18" fill="#d3d9cb">V：修轴取油壶，不找材料</text><text x="1484" y="577" font-size="18" fill="#d3d9cb">S/N：推箱露插销 或 H破栏</text><text x="1484" y="606" font-size="18" fill="#d3d9cb">两种解法只开同一个 W08箱</text><text x="1484" y="635" font-size="18" fill="#d3d9cb">G：Boss败后抬杆 → W02</text><text x="1484" y="664" font-size="18" fill="#d3d9cb">抬杆副格 T03，验货后去二章</text><text x="1484" y="718" font-size="22" font-weight="700" fill="#dbb56f">探索不变成清单</text><text x="1484" y="753" font-size="18" fill="#d3d9cb">C→V→F→P→J→G即可主线</text><text x="1484" y="782" font-size="18" fill="#d3d9cb">H/S可后补；零油仍能破栏</text><text x="1484" y="811" font-size="18" fill="#d3d9cb">J→V近路不等于C→G车道</text><text x="1484" y="840" font-size="18" fill="#d3d9cb">道标后15币与装备箱分账</text><line x1="48" y1="1175" x2="110" y2="1175" stroke="#638680" stroke-width="5"/><text x="125" y="1182" class="label">实线：可步行双向连接</text><line x1="460" y1="1175" x2="522" y2="1175" stroke="#dbb56f" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arr)"/><text x="540" y="1182" class="label">虚线箭头：首开方向，开后双向</text><line x1="1040" y1="1175" x2="1102" y2="1175" stroke="#df8c79" stroke-width="5" marker-end="url(#red)"/><text x="1120" y="1182" class="label">珊瑚箭头：有条件的首次前进</text><text x="48" y="1233" class="small">v1尺度未通过 · 仅局部逻辑参考 · 非比例地形 · 连线交叉无节点则不相通 · 不新增跳跃/攀爬/游泳 · 开启后可回访 · 未实现/未实测</text><text x="1872" y="1233" text-anchor="end" class="small">2026-11-02 · v1</text></svg>