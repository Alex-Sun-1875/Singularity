ize="25" font-weight="700" fill="#e9e1cc">装备与帐篷</text><text x="922" y="936" font-size="17" fill="#a5b6ae">整备不补符或刷新</text><text x="922" y="955" font-size="15" fill="#67c0ac">chest · 0层</text></g><g id="node-practice"><rect x="984" y="496" width="192" height="88" rx="12" fill="#20353c" stroke="#67c0ac" stroke-width="2.5"/><rect x="984" y="496" width="7" height="88" rx="3" fill="#67c0ac"/><text x="1002" y="526" font-size="25" font-weight="700" fill="#e9e1cc">木桩训练角</text><text x="1002" y="556" font-size="17" fill="#a5b6ae">练输入 / 不刷掉落</text><text x="1002" y="575" font-size="15" fill="#67c0ac">practice · 0层</text></g><g id="node-gate"><rect x="954" y="216" width="192" height="88" rx="12" fill="#20353c" stroke="#99b9d4" stroke-width="2.5"/><rect x="954" y="216" width="7" height="88" rx="3" fill="#99b9d4"/><text x="972" y="246" font-size="25" font-weight="700" fill="#e9e1cc">木门外侧</text><text x="972" y="276" font-size="17" fill="#a5b6ae">能观察，不能隔门抬杆</text><text x="972" y="295" font-size="15" fill="#99b9d4">gate · 0层</text></g><g id="node-side"><rect x="564" y="256" width="192" height="88" rx="12" fill="#20353c" stroke="#638680" stroke-width="2.5"/><rect x="564" y="256" width="7" height="88" rx="3" fill="#638680"/><text x="582" y="286" font-size="25" font-weight="700" fill="#e9e1cc">单人侧口</text><text x="582" y="316" font-size="17" fill="#a5b6ae">通往ch01_V契约车棚</text><text x="582" y="335" font-size="15" fill="#638680">side · 0层</text></g><text x="60" y="194" font-size="21" fill="#67c0ac">整个营地统一归 area_ch01_camp / ch01_C</text><text x="550" y="1090" font-size="20" fill="#df8c79">宽车道G→C仅败队长并抬杆后通</text><text x="1484" y="190" font-size="22" font-weight="700" fill="#dbb56f">一个已知检查点</text><text x="1484" y="225" font-size="18" fill="#d3d9cb">cp_ch01_camp 默认可用</text><text x="1484" y="254" font-size="18" fill="#d3d9cb">本页建筑标签仅美术定位</text><text x="1484" y="283" font-size="18" fill="#d3d9cb">不是新增玩法ID或独立关卡</text><text x="1484" y="337" font-size="22" font-weight="700" fill="#dbb56f">两名初始商人</text><text x="1484" y="372" font-size="18" fill="#d3d9cb">艾妲：J03铜戒 28币</text><text x="1484" y="401" font-size="18" fill="#d3d9cb">布兰：A13战靴 32币</text><text x="1484" y="430" font-size="18" fill="#d3d9cb">接约后可交易；可完全不买</text><text x="1484" y="459" font-size="18" fill="#d3d9cb">蕾萨在救车后的ch01_F</text><text x="1484" y="488" font-size="18" fill="#d3d9cb">营地不提前复制她的摊位</text><text x="1484" y="542" font-size="22" font-weight="700" fill="#dbb56f">安全与学习</text><text x="1484" y="577" font-size="18" fill="#d3d9cb">营火 / 锻炉 / 木桩分开摆</text><text x="1484" y="606" font-size="18" fill="#d3d9cb">木桩不刷物，不计强制次数</text><text x="1484" y="635" font-size="18" fill="#d3d9cb">真实成功施符仍消耗纸符</text><text x="1484" y="664" font-size="18" fill="#d3d9cb">换装备不回生命或专注</text><text x="1484" y="693" font-size="18" fill="#d3d9cb">制作不要求铁匠对话资格</text><text x="1484" y="747" font-size="22" font-weight="700" fill="#dbb56f">出营路线</text><text x="1484" y="782" font-size="18" fill="#d3d9cb">侧口只能单人，不能走契约车</text><text x="1484" y="811" font-size="18" fill="#d3d9cb">木门横杆在门台内侧</text><text x="1484" y="840" font-size="18" fill="#d3d9cb">先绕入门内打队长再抬杆</text><text x="1484" y="869" font-size="18" fill="#d3d9cb">验货后车短淡出到安全交接位</text><text x="1484" y="898" font-size="18" fill="#d3d9cb">没有押车、付费门或必需魔法</text><line x1="48" y1="1175" x2="110" y2="1175" stroke="#638680" stroke-width="5"/><text x="125" y="1182" class="label">实线：可步行双向连接</text><line x1="460" y1="1175" x2="522" y2="1175" stroke="#dbb56f" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arr)"/><text x="540" y="1182" class="label">虚线箭头：首开方向，开后双向</text><line x1="1040" y1="1175" x2="1102" y2="1175" stroke="#df8c79" stroke-width="5" marker-end="url(#red)"/><text x="1120" y="1182" class="label">珊瑚箭头：有条件的首次前进</text><text x="48" y="1233" class="small">v1尺度未通过 · 仅局部逻辑参考 · 非比例地形 · 连线交叉无节点则不相通 · 不新增跳跃/攀爬/游泳 · 开启后可回访 · 未实现/未实测</text><text x="1872" y="1233" text-anchor="end" class="small">2026-11-02 · v1</text></svg>