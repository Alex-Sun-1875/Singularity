storage</text><text x="1484" y="283" font-size="18" fill="#d3d9cb">B · cp_ch03_dock / 战前转角</text><text x="1484" y="337" font-size="22" font-weight="700" fill="#dbb56f">商人 / 图纸 / 线索</text><text x="1484" y="372" font-size="18" fill="#d3d9cb">娜薇 A07 烬灯法袍 · 80币</text><text x="1484" y="401" font-size="18" fill="#d3d9cb">娜薇留原摊，不在四章复制</text><text x="1484" y="430" font-size="18" fill="#d3d9cb">侧室只留试衣单，不再发袍</text><text x="1484" y="459" font-size="18" fill="#d3d9cb">后门训练/配方箱与15币分账</text><text x="1484" y="513" font-size="22" font-weight="700" fill="#dbb56f">安全通路</text><text x="1484" y="548" font-size="18" fill="#d3d9cb">Y↔S↔D为开放门洞环路</text><text x="1484" y="577" font-size="18" fill="#d3d9cb">R→D卡板后双向，无板也能</text><text x="1484" y="606" font-size="18" fill="#d3d9cb">由R→F→D返回，不会困住</text><text x="1484" y="635" font-size="18" fill="#d3d9cb">水槽可重复用，不花材料</text><text x="1484" y="664" font-size="18" fill="#d3d9cb">主线物不燃；始终保留干路</text><text x="1484" y="718" font-size="22" font-weight="700" fill="#dbb56f">Boss后的同台奖励</text><text x="1484" y="753" font-size="18" fill="#d3d9cb">三点：圣印匣 / 原卷 / 礼器</text><text x="1484" y="782" font-size="18" fill="#d3d9cb">全部点验 → W10 + J05</text><text x="1484" y="811" font-size="18" fill="#d3d9cb">T06原固定包仍独立发现</text><text x="1484" y="840" font-size="18" fill="#d3d9cb">护符/铜芯明确二选一后进四章</text><text x="1484" y="869" font-size="18" fill="#d3d9cb">不搬货、不计时、不烧毁奖励</text><line x1="48" y1="1175" x2="110" y2="1175" stroke="#638680" stroke-width="5"/><text x="125" y="1182" class="label">实线：可步行双向连接</text><line x1="460" y1="1175" x2="522" y2="1175" stroke="#dbb56f" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arr)"/><text x="540" y="1182" class="label">虚线箭头：首开方向，开后双向</text><line x1="1040" y1="1175" x2="1102" y2="1175" stroke="#df8c79" stroke-width="5" marker-end="url(#red)"/><text x="1120" y="1182" class="label">珊瑚箭头：有条件的首次前进</text><text x="48" y="1233" class="small">v1尺度未通过 · 仅局部逻辑参考 · 非比例地形 · 连线交叉无节点则不相通 · 不新增跳跃/攀爬/游泳 · 开启后可回访 · 未实现/未实测</text><text x="1872" y="1233"