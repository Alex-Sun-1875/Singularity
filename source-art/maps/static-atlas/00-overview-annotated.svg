<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280"><title>全域连通总览 · 一趟四章探宝旅程：静态地图逻辑标注</title><desc>原创剑与火静态图册。设计者全知拓扑图，非玩家初始地图；线连接为权威，不是按比例的碰撞图。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#dbb56f"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#df8c79"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.small{font-size:18px;fill:#a5b6ae}.label{font-size:21px;fill:#e9e1cc}.mono{font-family:monospace;font-size:17px;fill:#a5b6ae}</style><rect width="1920" height="1280" fill="#111f25"/><rect x="32" y="148" width="1398" height="986" rx="20" fill="#192c32"/><rect x="1460" y="148" width="428" height="986" rx="20" fill="#192c32"/><text x="48" y="47" font-size="19" letter-spacing="4" fill="#dbb56f">SWORD &amp; FIRE  /  STATIC ATLAS  /  00 / WORLD</text><text x="48" y="104" font-size="42" font-weight="700" fill="#e9e1cc">全域连通总览 · 一趟四章探宝旅程</text><text x="1870" y="102" text-anchor="end" font-size="20" fill="#a5b6ae">区域内自由探索 / 章节间按已有线索推进</text><polyline id="edge-ch01-ch02" points="330,380 998.0,380.0" fill="none" stroke="#dbb56f" stroke-width="5" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="552" y="336" width="220" height="31" rx="5" fill="#192c32"/><text x="560" y="360" font-size="18" fill="#dbb56f">验货：转运单 → 矿桥</text><polyline id="edge-ch02-ch03" points="1100,380 1370,380 1370,650 330,650 330.0,880.0" fill="none" stroke="#dbb56f" stroke-width="5" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="552" y="606" width="240" height="31" rx="5" fill="#192c32"/><text x="560" y="630" font-size="18" fill="#dbb56f">军械台拓印 → 河湾旧堂</text><polyline id="edge-ch03-ch04" points="330,930 998.0,930.0" fill="none" stroke="#dbb56f" stroke-width="5" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="512" y="886" width="280" height="31" rx="5" fill="#192c32"/><text x="520" y="910" font-size="18" fill="#dbb56f">三点验清单 + 明确古物选择</text><g id="node-ch01"><rect x="234" y="336" width="192" height="88" rx="12" fill="#20353c" stroke="#638680" stroke-width="2.5"/><rect x="234" y="336" width="7" height="88" rx="3" fill="#638680"/><text x="252" y="366" font-size="25" font-weight="700" fill="#e9e1cc">01 灰披宝匣</text><text x="252" y="396" font-size="17" fill="#a5b6ae">含石桥驿营 / 3路线</text><text x="252" y="415" font-size="15" fill="#638680">ch01 · 0层</text></g><g id="node-ch02"><rect x="1004" y="336" width="192" height="88" rx="12" fill="#20353c" stroke="#638680" stroke-width="2.5"/><rect x="1004" y="336" width="7" height="88" rx="3" fill="#638680"/><text x="1022" y="366" font-size="25" font-weight="700" fill="#e9e1cc">02 沉桥宝库</text><text x="1022" y="396" font-size="17" fill="#a5b6ae">轨道·高道·干槽</text><text x="1022" y="415" font-size="15" fill="#638680">ch02 · 0层</text></g><g id="node-ch03"><rect x="234" y="886" width="192" height="88" rx="12" fill="#20353c" stroke="#638680" stroke-width="2.5"/><rect x="234" y="886" width="7" height="88" rx="3" fill="#638680"/><text x="252" y="916" font-size="25" font-weight="700" fill="#e9e1cc">03 沉钟秘藏</text><text x="252" y="946" font-size="17" fill="#a5b6ae">前院·栈道·吊臂</text><text x="252" y="965" font-size="15" fill="#638680">ch03 · 0层</text></g><g id="node-ch04"><rect x="1004" y="886" width="192" height="88" rx="12" fill="#20353c" stroke="#638680" stroke-width="2.5"/><rect x="1004" y="886" width="7" height="88" rx="3" fill="#638680"/><text x="1022" y="916" font-size="25" font-weight="700" fill="#e9e1cc">04 灰石堡库</text><text x="1022" y="946" font-size="17" fill="#a5b6ae">环道·两外台·宝龛</text><text x="1022" y="965" font-size="15" fill="#638680">ch04 · 0层</text></g><text x="160" y="470" font-size="23" fill="#67c0ac">营地 C：艾妲 / 布兰</text><text x="160" y="510" font-size="23" fill="#67c0ac">岔口 F：蕾萨</text><text x="940" y="470" font-size="23" fill="#67c0ac">矿口 E：墨伦 / 布兰</text><text x="940" y="510" font-size="20" fill="#a5b6ae">放桥后布兰迁桥后安全位</text><text x="160" y="1020" font-size="23" fill="#67c0ac">河湾 E：娜薇 / 艾妲</text><text x="940" y="1020" font-size="23" fill="#67c0ac">城外 E：布兰 / 艾妲</text><text x="160" y="210" font-size="20" fill="#a5b6ae">相连区域，不是无缝大陆；总览方位只作构图索引</text><text x="1484" y="190" font-size="22" font-weight="700" fill="#dbb56f">六张场景 / 六张标注图</text><text x="1484" y="225" font-size="18" fill="#d3d9cb">总览 + 营地 + 四章</text><text x="1484" y="254" font-size="18" fill="#d3d9cb">PNG看材质、地标与空间</text><text x="1484" y="283" font-size="18" fill="#d3d9cb">SVG看连线、层级和条件</text><text x="1484" y="312" font-size="18" fill="#d3d9cb">本套是完整设计态图册</text><text x="1484" y="341" font-size="18" fill="#d3d9cb">不冒充游戏截图或可玩关卡</text><text x="1484" y="395" font-size="22" font-weight="700" fill="#dbb56f">回访规则</text><text x="1484" y="430" font-size="18" fill="#d3d9cb">亲抵并解锁的安全检查点</text><text x="1484" y="459" font-size="18" fill="#d3d9cb">才可从安全点选择前往</text><text x="1484" y="488" font-size="18" fill="#d3d9cb">完整四章版可回已实现旧区</text><text x="1484" y="517" font-size="18" fill="#d3d9cb">未实现后章不提供空传送</text><text x="1484" y="546" font-size="18" fill="#d3d9cb">回访不补货、不刷Boss或宝物</text><text x="1484" y="600" font-size="22" font-weight="700" fill="#dbb56f">五位商人，不同货路</text><text x="1484" y="635" font-size="18" fill="#d3d9cb">艾妲首饰 / 布兰护具盾</text><text x="1484" y="664" font-size="18" fill="#d3d9cb">蕾萨猎具 / 墨伦符印钟坠</text><text x="1484" y="693" font-size="18" fill="#d3d9cb">娜薇火袍与高阶符纸</text><text x="1484" y="722" font-size="18" fill="#d3d9cb">迁移同一账户，不复制库存</text><text x="1484" y="751" font-size="18" fill="#d3d9cb">地图点图标不等于远程购物</text><text x="1484" y="805" font-size="22" font-weight="700" fill="#dbb56f">核心不变量</text><text x="1484" y="840" font-size="18" fill="#d3d9cb">每章三路 + 横接 + 返回回路</text><text x="1484" y="869" font-size="18" fill="#d3d9cb">地图未知 / 听闻 / 亲历分层</text><text x="1484" y="898" font-size="18" fill="#d3d9cb">0金币 / 0符 / 0油仍可主线</text><text x="1484" y="927" font-size="18" fill="#d3d9cb">宝箱/Boss/商人不预铺全亮</text><text x="1484" y="956" font-size="18" fill="#d3d9cb">本图全知只供设计评审</text><line x1="48" y1="1175" x2="110" y2="1175" stroke="#638680" stroke-width="5"/><text x="125" y="1182" class="label">实线：可步行双向连接</text><line x1="460" y1="1175" x2="522" y2="1175" stroke="#dbb56f" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#arr)"/><text x="540" y="1182" class="label">虚线箭头：首开方向，开后双向</text><line x1="1040" y1="1175" x2="1102" y2="1175" stroke="#df8c79" stroke-width="5" marker-end="url(#red)"/><text x="1120" y="1182" class="label">珊瑚箭头：有条件的首次前进</text><text x="48" y="1233" class="small">v1尺度未通过 · 仅局部逻辑参考 · 非比例地形 · 连线交叉无节点则不相通 · 不新增跳跃/攀爬/游泳 · 开启后可回访 · 未实现/未实测</text><text x="1872" y="1233" text-anchor="end" class="small">2026-11-02 · v1</text></svg>