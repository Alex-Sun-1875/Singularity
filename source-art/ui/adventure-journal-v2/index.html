   <button class="pin merchant" aria-label="商人"><svg><use href="#bag"/></svg></button>
   <button class="pin exit" aria-label="区域通道"><svg><use href="#gate"/></svg></button>
   <p class="map-caption">区域地图<small>未知区域仍被迷雾笼罩</small></p>
   <div class="map-tools"><button aria-label="缩小">−</button><button aria-label="放大">+</button><button aria-label="定位"><svg><use href="#aim"/></svg></button></div>
  </div>
  <aside class="waypoints"><div class="side-frame"></div>
   <h2 class="waypoint-heading"><svg><use href="#rune"/></svg>传送点</h2><div class="rule"></div>
   <div class="waypoint-list">
    <button class="destination"><svg><use href="#rune"/></svg>断岳山驿</button>
    <button class="destination active"><svg><use href="#rune"/></svg>岩炉镇</button>
    <button class="destination"><svg><use href="#rune"/></svg>伤工棚街</button>
    <button class="destination locked"><svg><use href="#rune"/></svg>破阵军械岸</button>
   </div>
   <footer class="travel-footer"><p class="travel-status">已解锁 · 可前往</p><button class="travel"><svg><use href="#rune"/></svg>传送</button></footer>
  </aside>
 </section>
</main>
<script>
function fit(){const scale=Math.min(innerWidth/844,innerHeight/390),screen=document.querySelector('#screen');screen.style.transform=`scale(${scale})`;screen.style.left=`${(innerWidth-844*scale)/2}px`;screen.style.top=`${(innerHeight-390*scale)/2}px`}
function selectView(view){document.querySelector('#screen').dataset.view=view;document.querySelectorAll('[data-page]').forEach(p=>p.classList.toggle('active',p.dataset.page===view));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('selected',b.dataset.view===view))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectView(b.dataset.view));document.querySelector('.map-link').onclick=()=>selectView('map');
document.querySelector('.hide-completed').onclick=function(){const hide=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',hide);document.querySelectorAll('.completed').forEach(n=>n.hidden=hide)};
document.querySelectorAll('.destination').forEach(b=>b.onclick=()=>{document.querySelectorAll('.destination').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.querySelector('.travel-status').textContent=b.classList.contains('locked')?'尚未解锁':'已解锁 · 可前往';document.querySelector('.travel').disabled=b.classList.contains('locked')});
selectView(new URLSearchParams(location.search).get('view')==='map'?'map':'tasks');fit();addEventListener('resize',fit);
</script>
</body></html>
