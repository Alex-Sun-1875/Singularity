<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剑与火 · 地图与任务 UI 设计稿 v6</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="compass" viewBox="0 0 24 24"><path d="M12 1v22M1 12h22" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor"/><path d="m12 4 2.2 5.8L20 12l-5.8 2.2L12 20l-2.2-5.8L4 12l5.8-2.2Z" fill="#17110b" stroke="currentColor" stroke-width="1.1"/><path d="m12 7 2 5-2 2-2-2Z" fill="currentColor"/></symbol>
<symbol id="quill" viewBox="0 0 24 24"><path d="M18 2c-7 0-12 6-11 12l-3 6 2 1 4-7c5-1 10-6 8-12Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m7 17 9-12M10 12l4 1M12 9l4 1M3 22h11" stroke="currentColor" stroke-width="1.1" fill="none"/></symbol>
<symbol id="quest" viewBox="0 0 24 24"><path d="m12 1 11 11-11 11L1 12Z" fill="#302313" stroke="currentColor" stroke-width="1.2"/><path d="m12 5 7 7-7 7-7-7Z" fill="currentColor"/><path d="M12 0v4m0 16v4M0 12h4m16 0h4" stroke="currentColor"/></symbol>
<symbol id="player" viewBox="0 0 24 24"><path d="m12 2 10 10-10 10L2 12Z" fill="currentColor" stroke="#112b2e" stroke-width="2"/></symbol>
<symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 21v-4a7 7 0 0 1 14 0v4" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
<symbol id="bag" viewBox="0 0 24 24"><path d="m8 3 4 2 4-2-2 6c4 3 6 6 5 10-1 4-13 4-14 0-1-4 1-7 5-10Z" fill="#24190e" stroke="currentColor" stroke-width="1.4"/><path d="M8 9h8m-4 3v7m-3-3h6" stroke="currentColor" fill="none"/></symbol>
<symbol id="camp" viewBox="0 0 24 24"><path d="M14 2c1 6-4 6-2 10 2-2 3-3 4-5 6 7 4 13-4 14-8-1-10-7-5-12-1 5 0 5 2 6-1-6 5-7 5-13Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m4 23 16-3M4 20l16 3" stroke="currentColor"/></symbol>
<symbol id="gate" viewBox="0 0 24 24"><path d="M4 22V10a8 8 0 0 1 16 0v12M8 22V10a4 4 0 0 1 8 0v12M2 22h20" stroke="currentColor" fill="none" stroke-width="1.4"/></symbol>
<symbol id="rune" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#1f1725" stroke="currentColor"/><path d="m12 5 5 7-5 7-5-7Zm0-4v5m0 12v5M1 12h5m12 0h5" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="flag" viewBox="0 0 24 24"><path d="M6 23V2c4-3 7 4 13 1v11c-6 3-9-4-13-1" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
<symbol id="aim" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M12 1v7m0 8v7M1 12h7m8 0h7" stroke="currentColor" stroke-width="1.1"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></symbol>
<symbol id="flourish" viewBox="0 0 140 40"><path d="M0 20h124m-110 0C22 2 39 6 33 16c-4 7-13-3-6-6m9 10C45 0 66 4 57 15c-5 6-15-4-7-6m14 11C76 7 89 12 85 18m-71 2c8 18 25 14 19 4-4-7-13 3-6 6m9-10c9 20 30 16 21 5-5-6-15 4-7 6m14-11c12 13 25 8 21 2m35-7 7 5-7 5" fill="none" stroke="currentColor" stroke-width=".8"/></symbol>
</defs></svg>
<main id="screen" data-view="tasks">
 <div id="window" class="layer">
 <header class="top">
  <img class="brand" src="assets/prep-logo-v5.png" alt="剑与火">
  <span class="brand-separator" aria-hidden="true"></span><span class="header-title">冒险日志</span>
  <nav class="tabs" aria-label="冒险界面"><button class="tab" data-view="map">地图</button><button class="tab selected" data-view="tasks">任务</button></nav>
  <span class="header-chapter">第二章 · 群山战火</span>
  <button class="back" aria-label="返回"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7M7 12h13"/></svg></button>
 </header>
 <section class="page task-page active layer" data-page="tasks">
  <aside class="tree">
   <div class="tree-head"><h1>任务日志</h1><button class="hide-completed" aria-pressed="false"><span class="check"></span>隐藏已完成</button></div>
   <div class="tree-scroll">
    
    <button class="tree-row chapter"><span class="triangle"></span>第二章 · 群山战火<span class="kind-label">主线</span></button>
    <button class="tree-row leaf selected"><span>采坑中的两份证据</span><em class="attention">!</em></button>
    <button class="tree-row leaf completed"><span>熔镜工位保卫战</span><small>（已完成）</small></button>
    <button class="tree-row side"><span class="triangle collapsed"></span>支线任务<span class="badge">3</span></button>
    <button class="tree-row chapter"><span class="triangle collapsed"></span>第一章 · 兽潮之夜</button>
    <button class="tree-row future"><span class="triangle collapsed"></span>第三章<small>敬请期待</small></button>
   </div>
   <div class="scroll-hint tree-hint" aria-hidden="true"></div>
  </aside>
  <article class="reader">
   <div class="eyebrow">第二章 · 群山战火</div>
   <h2>采坑中的两份证据</h2>
   <div class="rule"></div>
   <div class="reader-scroll">
    <p class="story">军队正在征用工匠与矿械。采坑中的证人与货签，或许能揭开这张征用令背后的真相。</p>
    <h3 class="objective-title"><svg><use href="#quest"/></svg>当前目标</h3>
    <p class="objective">救援被困证人，或保全采坑货签。</p>
    <p class="updates-title">调查记录</p>
    <p class="update">采坑调查已完成，两条可行路线已经明确。</p>
    <p class="update">工匠证人和货签都能提供线索。选择哪条路线，由你决定。</p>
    <p class="update recorded">熔镜工位的守军已被击退，撤离通道得以保住。</p>
   </div>
   <div class="scroll-hint reader-hint" aria-hidden="true"></div>
   <footer class="reader-footer"><span class="read-status">进行中</span><button class="map-link"><svg><use href="#compass"/></svg>在地图查看</button></footer>
  </article>
 </section>
 <section class="page map-page layer" data-page="map">
  <aside class="legend"><div class="side-frame"></div><h1 class="region-title">断岳高地</h1><div class="small-rule"></div>
   <div class="legend-list">
    <div class="legend-row"><svg class="cyan"><use href="#player"/></svg>当前位置</div>
    <div class="legend-row"><svg class="amber"><use href="#quest"/></svg>任务目标</div>
    <div class="legend-row"><svg class="green"><use href="#person"/></svg>人物</div>
    <div class="legend-row"><svg class="brown"><use href="#bag"/></svg>商人</div>
    <div class="legend-row"><svg class="brown"><use href="#camp"/></svg>休整点</div>
    <div class="legend-row"><svg class="brown"><use href="#gate"/></svg>区域通道</div>
    <div class="legend-row"><svg class="purple"><use href="#rune"/></svg>传送点</div>
    <div class="legend-row"><svg class="amber"><use href="#flag"/></svg>自定标记</div>
   </div><p class="legend-note">拖动地图 · 双指缩放</p>
  </aside>
  <div class="cartography" aria-label="断岳高地区域地图">
   <div class="atlas"></div><div class="fog"></div><div class="map-edge"></div><div class="map-shade"></div>
   <div class="north">N<svg><use href="#compass"/></svg></div>
   <button class="pin quest" aria-label="任务：采坑中的两份证据"><svg><use href="#quest"/></svg><span>采坑 · 当前任务</span></button>
   <button class="pin player" aria-label="当前位置"><svg><use href="#player"/></svg><span>你的位置</span></button>
   <button class="pin waypoint" aria-label="传送点：岩炉镇"><svg><use href="#rune"/></svg><span>岩炉镇</span></button>
   <button class="pin merchant" aria-label="商人"><svg><use href="#bag"/></svg></button>
   <button class="pin exit" aria-label="区域通道"><svg><use href="#gate"/></svg></button>
   <p class="map-caption">区域地图<small>未知区域仍被迷雾笼罩</small></p>
   <div class="map-tools"><button aria-label="缩小">−</button><button aria-label="放大">+</button><button aria-label="定位"><svg><use href="#aim"/></svg></button></div>
  </div>
  <aside class="waypoints"><div class="side-frame"></div>
   <h2 class="waypoint-heading"><svg><use href="#rune"/></svg>传送点</h2><div class="rule"></div>
   <div class="waypoint-list">
    <button class="destination"><span class="destination-name">断岳山驿</span></button>
    <button class="destination active"><span class="destination-name">岩炉镇</span></button>
    <button class="destination"><span class="destination-name">伤工棚街</span></button>
    <button class="destination locked"><span class="destination-name">破阵军械岸</span><small>未解锁</small></button>
   </div>
   <footer class="travel-footer"><button class="travel"><svg><use href="#rune"/></svg><span class="travel-label">传送</span></button></footer>
  </aside>
 </section>
 </div>
</main>
<script>
function fit(){const scale=Math.min(innerWidth/844,innerHeight/390),screen=document.querySelector('#screen');screen.style.transform=`scale(${scale})`;screen.style.left=`${(innerWidth-844*scale)/2}px`;screen.style.top=`${(innerHeight-390*scale)/2}px`}
function selectView(view){document.querySelector('#screen').dataset.view=view;document.querySelectorAll('[data-page]').forEach(p=>p.classList.toggle('active',p.dataset.page===view));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('selected',b.dataset.view===view))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectView(b.dataset.view));document.querySelector('.map-link').onclick=()=>selectView('map');
document.querySelector('.hide-completed').onclick=function(){const hide=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',hide);document.querySelectorAll('.completed').forEach(n=>n.hidden=hide)};
document.querySelectorAll('.destination').forEach(b=>b.onclick=()=>{document.querySelectorAll('.destination').forEach(n=>n.classList.remove('active'));b.classList.add('active');document.querySelector('.travel-label').textContent=b.classList.contains('locked')?'尚未解锁':'传送';document.querySelector('.travel').disabled=b.classList.contains('locked')});
selectView(new URLSearchParams(location.search).get('view')==='map'?'map':'tasks');fit();addEventListener('resize',fit);
</script>
</body></html>
