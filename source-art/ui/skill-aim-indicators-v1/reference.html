<div id="cast-refined" aria-label="淡金窄雾边射程圈与刻纹落点圈设计">
<style>
  #cast-refined{--cr-ink:light-dark(#453d31,#ede4cb);--cr-secondary:light-dark(#74664e,#b7a68d);--cr-line:light-dark(#ded6c9,#4b4032);--cr-selected:light-dark(#876b37,#e4d3b0);--cr-control:light-dark(#eee9df,#322b22);font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;color:var(--cr-ink);width:100%}
  #cast-refined *{box-sizing:border-box}
  #cast-refined button,#cast-refined select{font:inherit}
  #cast-refined .cr-scene{position:relative;isolation:isolate;aspect-ratio:844/390;width:100%;background:#272421;overflow:hidden}
  #cast-refined .cr-field{display:block;width:100%;height:100%;touch-action:none;color:#e4d3b0}
  #cast-refined .cr-scene[data-mode="blocked"] .cr-field{color:#f18e9f}
  #cast-refined .cr-marks{pointer-events:none}
  #cast-refined .cr-world{--cr-active:#c2aa79;--cr-hot:#ede4cb;--cr-deep:#746042;color:var(--cr-active)}
  #cast-refined .cr-scene[data-mode="blocked"] .cr-world{--cr-active:#f18e9f;--cr-hot:#ffe0e7;--cr-deep:#bc657b}
  #cast-refined .cr-ring-stroke{fill:none;stroke:var(--cr-active)}
  #cast-refined .cr-edge{fill:none;stroke:url(#cr-border-material);stroke-width:1.45;stroke-opacity:.95}
  #cast-refined .cr-rim{fill:none;stroke:var(--cr-active);stroke-width:.85;stroke-opacity:.64}
  #cast-refined .cr-core{fill:none;stroke:url(#cr-border-material);stroke-width:1.5;stroke-linecap:round}
  #cast-refined .cr-cancel{position:absolute;left:87.8%;top:49%;transform:translate(-50%,-50%);width:52px;height:52px;padding:0;border:1px solid #baa77f80;border-radius:50%;background:radial-gradient(circle,#2c2925ed 40%,#171613e6 100%);color:#d7c9ac;box-shadow:inset 0 0 0 3px #211e1980;display:grid;place-items:center}
  #cast-refined .cr-cancel .cr-x{font:400 25px/1 Georgia,serif;position:relative;top:-1px}
  #cast-refined .cr-cancel small{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#ede4cb;font-size:11px;text-shadow:0 1px 3px #181511}
  #cast-refined .cr-cancel[aria-pressed="true"]{border-color:#f18e9f;color:#ffe0e7;background:radial-gradient(circle,#6c3546ed,#342027ed)}
  #cast-refined .cr-wheel{position:absolute;left:79.2%;top:77.7%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;padding:0;touch-action:none;border:1px solid #c2aa795c;background:radial-gradient(circle,transparent 39%,#b59a6810 44%,#b59a6810 62%,#c2aa7926 64%,transparent 67%);box-shadow:inset 0 0 0 3px #211b1326}
  #cast-refined .cr-knob{position:absolute;left:50%;top:50%;width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border:1px solid #e4d3b0ac;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9b48c66,#342b20e6);box-shadow:0 1px 3px #1b150f66;pointer-events:none;transform:translate(var(--cr-kx,20px),var(--cr-ky,-12px))}
  #cast-refined .cr-scene[data-mode="cancel"] .cr-marks{opacity:.23}
  #cast-refined .cr-scene[data-mode="cancel"] .cr-wheel{opacity:.45}
  #cast-refined .cr-scene[data-mode="blocked"] .cr-edge{stroke:var(--cr-hot);stroke-dasharray:7 5}
  #cast-refined .cr-scene[data-mode="blocked"] [data-brackets],#cast-refined .cr-scene[data-mode="blocked"] [data-notches]{opacity:.3}
  #cast-refined .cr-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;padding:9px 0 0}
  #cast-refined .cr-caption{color:var(--cr-secondary);font-size:12px;padding:8px 0}
  #cast-refined .cr-settings{display:flex;gap:8px;align-items:center;margin-left:auto}
  #cast-refined .cr-settings label{color:var(--cr-secondary);font-size:12px}
  #cast-refined .cr-zoom{border:0;background:transparent;color:var(--cr-selected);padding:8px;min-height:44px;white-space:nowrap}
  #cast-refined .cr-scene[data-zoom="detail"] .cr-cancel,#cast-refined .cr-scene[data-zoom="detail"] .cr-wheel{display:none}
  #cast-refined select{min-height:44px;border:0;border-radius:5px;background:var(--cr-control);color:var(--cr-ink);padding:7px 28px 7px 12px;max-width:100%}
  #cast-refined .cr-status{color:var(--cr-secondary);font-size:12px;min-height:24px;padding-top:4px}
  #cast-refined .cr-notice{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:3px 12px;color:#ffdbe4;background:#32252be0;font-size:12px;white-space:nowrap;pointer-events:none}
  #cast-refined .cr-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:560px){#cast-refined .cr-cancel{width:44px;height:44px;left:88.8%;top:47%}#cast-refined .cr-cancel small{display:none}#cast-refined .cr-wheel{width:48px;height:48px}#cast-refined .cr-knob{width:19px;height:19px;margin:-9.5px 0 0 -9.5px}#cast-refined .cr-type{padding:10px 11px}#cast-refined .cr-settings{margin-left:0}#cast-refined .cr-bottom{gap:4px 12px}#cast-refined .cr-notice{top:8%}}
  @media(prefers-reduced-motion:no-preference){#cast-refined .cr-type,#cast-refined .cr-cancel{transition:color .12s,border-color .12s,background .12s}#cast-refined .cr-marks{transition:opacity .12s}}
</style>
<div class="cr-scene" data-mode="valid" aria-label="施法指示器效果预览">
  <svg class="cr-field" viewBox="0 0 844 390" role="img" aria-labelledby="cr-title cr-desc">
    <title id="cr-title">淡金窄雾边射程圈与香槟金落点圈</title>
    <desc id="cr-desc">沿用参考图的淡金半透明外圈，收窄雾边并降低模糊程度。最远施法距离保持不变，圆形落点继续使用香槟金渐变内沿与短刻纹。</desc>

        <stop data-fade-mid offset=".9" stop-color="currentColor" stop-opacity=".1"/>
        <stop offset=".965" stop-color="currentColor" stop-opacity=".25"/>
        <stop offset="1" stop-color="currentColor" stop-opacity=".36"/>

        <stop offset=".5" stop-color="#fff5dc"/>
        <stop offset=".73" stop-color="#cfb680"/>
        <stop offset="1" stop-color="#ede4cb"/>

      <radialGradient id="cr-range-mist" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="180">

        <stop data-mist-outer offset=".98" stop-color="#e4d3b0" stop-opacity=".09"/>
        <stop offset="1" stop-color="#e4d3b0" stop-opacity="0"/>

<script>
(() => {
 const root=document.getElementById('cast-refined'),q=s=>root.querySelector(s),field=q('.cr-field'),wheel=q('.cr-wheel');
 const state={mode:'valid',dx:136,dz:69,rim:.8,opacity:.65,gradientWidth:10,engraving:true,zoom:false,mistOpacity:.84,mistSoftness:.65,mistWidth:6};
 function restore(saved){const p=saved?.privateContent;if(p?.version!==7)return;if(['valid','blocked','cancel'].includes(p.mode))state.mode=p.mode;if(Number.isFinite(p.dx)&&Number.isFinite(p.dz)){state.dx=p.dx;state.dz=p.dz;}}
 restore(window.openai?.widgetState);
 const persist=()=>window.openai?.setWidgetState?.({modelContent:{design:'参考雾化版收窄模糊带、减弱朦胧效果，施法半径不变，保留香槟金刻纹圆形落点',shape:'circle',mode:state.mode},privateContent:{version:7,mode:state.mode,dx:state.dx,dz:state.dz}})?.catch(()=>{});
 const attrs=(el,a)=>Object.entries(a).forEach(([k,v])=>el.setAttribute(k,String(v)));
 const visible=(el,on)=>{el.removeAttribute('hidden');el.style.display=on?'':'none';};
 const arc=(r,a,b)=>`M${Math.cos(a)*r},${Math.sin(a)*r} A${r},${r} 0 0 1 ${Math.cos(b)*r},${Math.sin(b)*r}`;
 function render(){
  const d=Math.hypot(state.dx,state.dz),scale=d>174?174/d:1,x=state.dx*scale,z=state.dz*scale;
  q('.cr-scene').dataset.mode=state.mode;q('#cr-state').value=state.mode;
  q('.cr-cancel').setAttribute('aria-pressed',state.mode==='cancel'?'true':'false');
  visible(q('[data-invalid]'),state.mode==='blocked');
  attrs(q('[data-range]'),{opacity:state.mistOpacity});attrs(q('[data-range-blur]'),{stdDeviation:state.mistSoftness});
  const mistRadius=174+state.mistWidth;
  attrs(q('[data-range-fog]'),{r:mistRadius});attrs(q('#cr-range-mist'),{r:mistRadius});
  for(const [selector,radius] of [['[data-mist-start]',174-state.mistWidth*2],['[data-mist-inner]',174-state.mistWidth*.95],['[data-mist-mid]',174-state.mistWidth*.42],['[data-mist-peak]',174],['[data-mist-outer]',174+state.mistWidth*.4]])attrs(q(selector),{offset:radius/mistRadius});
  attrs(q('[data-landing]'),{transform:`translate(${x} ${z})`});
  const r=53;
  const zoomWidth=205,zoomHeight=zoomWidth*390/844,zoomX=382+x,zoomY=221+z*.58;
  attrs(field,{viewBox:state.zoom?`${zoomX-zoomWidth/2} ${zoomY-zoomHeight/2} ${zoomWidth} ${zoomHeight}`:'0 0 844 390'});
  q('.cr-scene').dataset.zoom=state.zoom?'detail':'full';
  q('.cr-zoom').setAttribute('aria-pressed',state.zoom?'true':'false');q('.cr-zoom').textContent=state.zoom?'完整画面':'放大边框';
  const inner=r-7,circumference=2*Math.PI*inner;
  attrs(q('[data-bloom]'),{r});attrs(q('[data-fill]'),{r});attrs(q('[data-rim]'),{r:inner,'stroke-width':state.rim,'stroke-opacity':state.opacity,'stroke-dasharray':`${circumference*.105} ${circumference*(1/6-.105)}`,'stroke-dashoffset':circumference*.022});attrs(q('[data-edge]'),{r});
  attrs(q('[data-fade-start]'),{offset:Math.max(.62,1-state.gradientWidth/r)});attrs(q('[data-fade-mid]'),{offset:Math.max(.78,1-state.gradientWidth*.46/r)});
  attrs(q('[data-brackets]'),{d:[0,1,2,3].map(i=>arc(r,i*Math.PI/2+Math.PI/4-.19,i*Math.PI/2+Math.PI/4+.19)).join(' ')});
  attrs(q('[data-notches]'),{d:Array.from({length:12},(_,i)=>{const a=i*Math.PI/6+Math.PI/12,outer=r-2.8,inner=r-(i%3===0?8.5:5.8);return `M${Math.cos(a)*inner},${Math.sin(a)*inner} L${Math.cos(a)*outer},${Math.sin(a)*outer}`;}).join(' ')});
  visible(q('[data-notches]'),state.engraving);
  visible(q('[data-center]'),state.mode!=='blocked');
  attrs(q('[data-invalid]'),{transform:`translate(${x} ${z})`});
  q('.cr-notice').hidden=state.mode!=='blocked';
  const knob=window.matchMedia('(max-width:560px)').matches?16:25;
  wheel.style.setProperty('--cr-kx',`${x/174*knob}px`);wheel.style.setProperty('--cr-ky',`${z/174*knob}px`);
  q('.cr-status').textContent=state.mode==='blocked'?'地形阻挡 · 作用轮廓断线，并显示叉号':state.mode==='cancel'?'取消施法 · 范围提示退为弱显示':state.zoom?'作用范围边框细节':'拖动地面或技能按钮调整落点';
 }
 const toField=e=>{const p=field.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(field.getScreenCTM().inverse());};
 let drag=null;
 field.addEventListener('pointerdown',e=>{if(e.button!==0||state.zoom)return;drag={type:'field',id:e.pointerId};field.setPointerCapture(e.pointerId);const p=toField(e);state.dx=p.x-382;state.dz=(p.y-221)/.58;state.mode='valid';render();});
 field.addEventListener('pointermove',e=>{if(drag?.type!=='field'||drag.id!==e.pointerId)return;const p=toField(e);state.dx=p.x-382;state.dz=(p.y-221)/.58;render();});
 field.addEventListener('pointerup',()=>{if(drag?.type==='field'){drag=null;persist();}});
 field.addEventListener('pointercancel',()=>{drag=null;});
 wheel.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={type:'wheel',id:e.pointerId,x:e.clientX,y:e.clientY};wheel.setPointerCapture(e.pointerId);state.mode='valid';render();});
 wheel.addEventListener('pointermove',e=>{if(drag?.type!=='wheel'||drag.id!==e.pointerId)return;state.dx=(e.clientX-drag.x)*5;state.dz=(e.clientY-drag.y)*5;const cancel=q('.cr-cancel').getBoundingClientRect();state.mode=Math.hypot(e.clientX-(cancel.x+cancel.width/2),e.clientY-(cancel.y+cancel.height/2))<cancel.width/2+8?'cancel':'valid';render();});
 wheel.addEventListener('pointerup',()=>{if(drag?.type==='wheel'){drag=null;persist();}});
 wheel.addEventListener('pointercancel',()=>{drag=null;state.mode='cancel';render();});
 wheel.addEventListener('keydown',e=>{const offsets={ArrowLeft:[-7,0],ArrowRight:[7,0],ArrowUp:[0,-7],ArrowDown:[0,7]};if(!offsets[e.key])return;e.preventDefault();state.dx+=offsets[e.key][0];state.dz+=offsets[e.key][1];state.mode='valid';render();persist();});
 q('#cr-state').addEventListener('change',e=>{state.mode=e.target.value;render();persist();});
 q('.cr-cancel').addEventListener('click',()=>{state.mode=state.mode==='cancel'?'valid':'cancel';render();persist();});
 q('.cr-zoom').addEventListener('click',()=>{state.zoom=!state.zoom;render();});
 window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'mistWidth',{label:'最远圈雾边宽度',min:3,max:10,step:.5});tweak.addSlider(state,'mistSoftness',{label:'最远圈模糊程度',min:.4,max:1.2,step:.05});tweak.addSlider(state,'mistOpacity',{label:'最远圈显著度',min:.5,max:1,step:.05});}
})();
</script>
</div>
