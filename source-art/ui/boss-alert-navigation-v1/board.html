<header><div><h1>首领刷新与自动导航</h1><p>剑与火 · 第一、二章　／　通知短暂出现，导航复用任务框，详细状态按需展开。</p></div><div class="version">UI 设计稿 v1<small>844 × 390 逻辑视口 · 2026.11.15</small></div></header>
<div class="grid">
<figure><figcaption><b>刷新时 · 顶部轻提醒</b><span>4 秒后收起</span></figcaption><img src="01-notice.png" alt="顶部可再战提醒与前往按钮"><p class="note">点击前往才开始寻路；错过提示仍可从地图进入目标列表。</p></figure>
<figure><figcaption><b>主动查看 · 首领与精英列表</b><span>按章节查看 · 内容可滚动</span></figcaption><img src="02-list.png" alt="首领与精英目标列表"><p class="note">在场、冷却、可再战分别表达；复用已有暗金框、字体与状态色。</p></figure>
<figure><figcaption><b>正在寻路 · 原任务框接管导航</b><span>停止 / 继续 / 抵达</span></figcaption><img src="03-route.png" alt="左侧任务框显示蓝色导航状态"><p class="note">只到安全入口；遇敌先暂停，不替玩家开战，也不自动恢复移动。</p></figure>
<figure><figcaption><b>尚在冷却 · 关注或提前前往</b><span>10 分钟独立冷却</span></figcaption><img src="06-cooldown.png" alt="精英冷却倒计时及提前前往"><p class="note">关注目标在剩余 30 秒时提醒一次；到时可再战，不限时消失。</p></figure>
</div>
<footer><span><b>3 个 Boss + 4 个具名精英</b>　沿用 600 秒复战</span><span><b>2 类循环精英</b>　50 秒 + 安全刷新条件</span><small>既有场景合成示意 · 非游戏实装截图 · 待用户审阅</small></footer>
</body></html>
